name: Контроль публикации

on:
  workflow_run:
    workflows: ["Публикация фотосета"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Записать результат
        shell: bash
        run: |
          printf 'CONCLUSION=%s\nRUN_ID=%s\nHEAD_SHA=%s\nRECORDED_AT=%s\n' \
            '${{ github.event.workflow_run.conclusion }}' \
            '${{ github.event.workflow_run.id }}' \
            '${{ github.event.workflow_run.head_sha }}' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > DEPLOY_STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOY_STATUS.txt
          git commit -m 'Статус публикации [skip ci]' || exit 0
          git push
