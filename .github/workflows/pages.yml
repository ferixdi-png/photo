name: Подготовка фотосета

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить проект
        uses: actions/checkout@v4

      - name: Установить обработку изображений
        run: python -m pip install --quiet pillow pillow-avif-plugin

      - name: Создать 29 отдельных фотографий
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/images
          mkdir -p assets/images
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter
          import pillow_avif

          source = Image.open('assets/sprites/all.avif').convert('RGB')
          assert source.size == (200, 10324), source.size
          out = Path('assets/images')

          for number in range(1, 30):
              top = (number - 1) * 356
              frame = source.crop((0, top, 200, top + 356))
              frame = frame.resize((720, 1280), Image.Resampling.LANCZOS)
              frame = frame.filter(ImageFilter.UnsharpMask(radius=1.0, percent=115, threshold=2))
              frame.save(out / f'{number:02d}.webp', 'WEBP', quality=92, method=6)

          files = list(out.glob('*.webp'))
          assert len(files) == 29, len(files)
          assert all(file.stat().st_size > 10000 for file in files)
          PY
          touch .nojekyll

      - name: Сохранить готовые фотографии
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images .nojekyll
          git diff --cached --quiet || git commit -m 'Добавить 29 готовых фотографий [skip ci]'
          git push
