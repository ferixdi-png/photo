name: Publish premium photo editorial in 1K

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        run: python -m pip install --quiet pillow pillow-avif-plugin

      - name: Build 1K image set and static site
        run: |
          mkdir -p public/assets/images public/assets
          cp site.html public/index.html
          cp styles.css public/styles.css
          cp site.js public/script.js
          cp assets/favicon.svg public/assets/favicon.svg
          cat >> public/styles.css <<'CSS'
          .photo-trigger{background-image:none!important}
          .photo-trigger img,.photo-trigger picture{opacity:1!important;pointer-events:auto!important}
          .photo-trigger img{height:auto;object-fit:cover}
          .hero__image img{width:100%;height:100%;object-fit:cover;object-position:center 43%}
          .lightbox__canvas img{display:block;max-width:min(80vw,720px);max-height:87vh;object-fit:contain;box-shadow:0 20px 80px rgba(0,0,0,.45)}
          CSS
          cat assets/data-v5/all.avif.000.b64 | tr -d '\n' | base64 --decode > /tmp/source-21.avif
          cat assets/data-v7/*.b64 | tr -d '\n' | base64 --decode > /tmp/source-29.avif
          python - <<'PY'
          from PIL import Image, ImageFilter
          import pillow_avif
          from pathlib import Path

          out = Path('public/assets/images')
          source21 = Image.open('/tmp/source-21.avif').convert('RGB')
          source29 = Image.open('/tmp/source-29.avif').convert('RGB')

          for number in range(1, 30):
              if number <= 21:
                  w, h = 360, 640
                  top = (number - 1) * h
                  frame = source21.crop((0, top, w, top + h))
              else:
                  w, h = 200, 356
                  top = (number - 1) * h
                  frame = source29.crop((0, top, w, top + h))

              frame = frame.resize((720, 1280), Image.Resampling.LANCZOS)
              frame = frame.filter(ImageFilter.UnsharpMask(radius=1.1, percent=115, threshold=2))
              frame.save(out / f'{number:02d}.webp', 'WEBP', quality=94, method=6)
          PY
          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
