name: Deploy premium photo editorial

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build static site
        run: |
          mkdir -p public/assets/sprites
          cp site.html public/index.html
          cp styles.css public/styles.css
          cp site.js public/script.js
          mkdir -p public/assets
          cp assets/favicon.svg public/assets/favicon.svg
          cat assets/data-v7/*.b64 | tr -d '\n' | base64 --decode > public/assets/sprites/all.avif
          touch public/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
