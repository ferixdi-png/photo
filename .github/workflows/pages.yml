name: Публикация фотосета

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получить проект
        uses: actions/checkout@v4

      - name: Установить обработку изображений
        run: python -m pip install --quiet pillow pillow-avif-plugin

      - name: Собрать сайт и 29 отдельных фотографий
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public/assets/images public/assets
          cp index.html public/index.html
          cp styles.css public/styles.css
          cp script.js public/script.js
          cp assets/favicon.svg public/assets/favicon.svg

          tr -d '\n\r ' < assets/data-v5/all.avif.000.b64 | base64 --decode > /tmp/high.avif
          cat assets/data-v7/*.b64 | tr -d '\n\r ' | base64 --decode > /tmp/all.avif

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter
          import pillow_avif

          out = Path('public/assets/images')
          high = Image.open('/tmp/high.avif').convert('RGB')
          all_frames = Image.open('/tmp/all.avif').convert('RGB')

          assert high.width == 360, high.size
          assert all_frames.width == 200, all_frames.size

          for number in range(1, 30):
              if number <= 21:
                  source = high
                  width, height = 360, 640
              else:
                  source = all_frames
                  width, height = 200, 356

              top = (number - 1) * height
              frame = source.crop((0, top, width, top + height))
              frame = frame.resize((720, 1280), Image.Resampling.LANCZOS)
              frame = frame.filter(ImageFilter.UnsharpMask(radius=1.1, percent=125, threshold=2))
              frame.save(out / f'{number:02d}.webp', 'WEBP', quality=92, method=6)

          assert len(list(out.glob('*.webp'))) == 29
          PY

          touch public/.nojekyll
          test -s public/assets/images/01.webp
          test -s public/assets/images/29.webp

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Загрузить сайт
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
