name: Публикация фотосерии

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получение проекта
        uses: actions/checkout@v4

      - name: Установка обработки изображений
        run: python -m pip install --quiet pillow pillow-avif-plugin

      - name: Сборка русской версии и 29 отдельных фотографий
        run: |
          mkdir -p public/assets/images public/assets
          cp index.html public/index.html
          cp styles.css public/styles.css
          cp script.js public/script.js
          cp assets/favicon.svg public/assets/favicon.svg
          cat assets/data-v5/all.avif.000.b64 | tr -d '\n' | base64 --decode > /tmp/high.avif
          cat assets/data-v7/*.b64 | tr -d '\n' | base64 --decode > /tmp/all.avif
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter
          import pillow_avif

          output = Path('public/assets/images')
          high = Image.open('/tmp/high.avif').convert('RGB')
          all_frames = Image.open('/tmp/all.avif').convert('RGB')

          for number in range(1, 30):
              if number <= 21:
                  width, height = 360, 640
                  top = (number - 1) * height
                  frame = high.crop((0, top, width, top + height))
              else:
                  width, height = 200, 356
                  top = (number - 1) * height
                  frame = all_frames.crop((0, top, width, top + height))

              frame = frame.resize((720, 1280), Image.Resampling.LANCZOS)
              frame = frame.filter(ImageFilter.UnsharpMask(radius=1.0, percent=110, threshold=2))
              frame.save(output / f'{number:02d}.webp', 'WEBP', quality=92, method=6)
          PY
          touch public/.nojekyll

      - name: Сохранение готовых фотографий в репозиторий
        run: |
          mkdir -p assets/images
          cp public/assets/images/*.webp assets/images/
          cp public/.nojekyll ./.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images .nojekyll
          git diff --cached --quiet || git commit -m "Готовые фотографии сайта [skip ci]"
          git push

      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Загрузка сайта
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
