name: Publish premium photo editorial

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build final 29-frame site
        run: |
          mkdir -p public/assets/sprites
          cp site.html public/index.html
          cp styles.css public/styles.css
          cp site.js public/script.js
          mkdir -p public/assets
          cp assets/favicon.svg public/assets/favicon.svg
          cat assets/data-v7/*.b64 | tr -d '\n' | base64 --decode > public/assets/sprites/all.avif
          touch public/.nojekyll

      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/pages -f build_type=workflow || true
          gh api --method PUT repos/${{ github.repository }}/pages -f build_type=workflow || true

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
