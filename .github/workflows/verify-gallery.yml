name: Проверка фотогалереи

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pillow pillow-avif-plugin
      - name: Проверить доступные фотоспрайты
        shell: bash
        run: |
          mkdir -p /tmp/images
          {
            echo 'FILES:'
            find assets -maxdepth 3 -type f -printf '%p %s bytes\n' | sort
            echo 'DECODE:'
          } > diagnostic.txt
          cat assets/data-v7/*.b64 | tr -d '\n\r ' | base64 --decode > /tmp/data-v7.avif 2>> diagnostic.txt || echo 'DATA_V7_DECODE_FAILED' >> diagnostic.txt
          cp assets/sprites/all.avif /tmp/sprite.avif
          file /tmp/data-v7.avif /tmp/sprite.avif >> diagnostic.txt 2>&1
          python - <<'PY' >> diagnostic.txt 2>&1
          from PIL import Image
          import pillow_avif, traceback
          for path in ['/tmp/data-v7.avif','/tmp/sprite.avif']:
              try:
                  im=Image.open(path)
                  print(path,'SIZE',im.size,'MODE',im.mode)
                  im.load()
                  print(path,'LOAD_OK')
              except Exception:
                  print(path,'FAILED')
                  traceback.print_exc()
          try:
              source=Image.open('/tmp/sprite.avif').convert('RGB')
              out='/tmp/images'
              for n in range(1,30):
                  frame=source.crop((0,(n-1)*356,200,n*356)).resize((720,1280),Image.Resampling.LANCZOS)
                  frame.save(f'{out}/{n:02d}.webp','WEBP',quality=90,method=6)
              import pathlib
              files=list(pathlib.Path(out).glob('*.webp'))
              print('OUTPUT_COUNT',len(files))
              print('OUTPUT_SIZES',min(f.stat().st_size for f in files),max(f.stat().st_size for f in files))
          except Exception:
              print('OUTPUT_FAILED')
              traceback.print_exc()
          PY
          cat diagnostic.txt
      - name: Сохранить диагностику
        uses: actions/upload-artifact@v4
        with:
          name: gallery-diagnostic
          path: diagnostic.txt
