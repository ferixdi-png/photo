name: Проверка 1K фотографий

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить все 29 изображений
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = sorted(Path('assets/images').glob('*.webp'))
          assert len(files) == 29, f'Найдено файлов: {len(files)}'

          bad = []
          for file in files:
              with Image.open(file) as image:
                  if image.size != (720, 1280):
                      bad.append((file.name, image.size))

          assert not bad, f'Неверные размеры: {bad}'
          print('VERIFIED: 29 files, all 720x1280')
          PY
