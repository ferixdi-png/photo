name: Verify live editorial

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify public site
        run: |
          URL="https://raw.githack.com/ferixdi-png/photo/main/index.html"
          for attempt in {1..12}; do
            if curl -fsSL "$URL" | grep -q "PRESENCE"; then
              printf '%s\n' "$URL" > LIVE_URL.txt
              break
            fi
            sleep 5
          done
          test -s LIVE_URL.txt
      - name: Mark verified
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LIVE_URL.txt
          git diff --cached --quiet || git commit -m "Verify live editorial link"
          git push
